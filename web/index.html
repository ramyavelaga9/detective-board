<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detective Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <i class="ph-fill ph-push-pin brand-pin" aria-hidden="true"></i>
        <div class="brand-text">
          <h1>Detective Board</h1>
          <span class="case-id"><i class="ph ph-file-text"></i> Case DB-1001</span>
        </div>
      </div>
      <div class="controls">
        <label class="reset-memory">
          <input type="checkbox" id="reset-memory" />
          <i class="ph ph-arrow-counter-clockwise"></i> Reset memory
        </label>
        <button id="start-btn"><i class="ph-fill ph-magnifying-glass"></i> Start Investigation</button>
      </div>
    </header>

    <main class="layout">
      <section class="board-panel">
        <svg id="board" width="100%" height="100%"></svg>
        <p class="board-hint"><i class="ph ph-hand-grabbing"></i> Drag to arrange · Click a card to inspect</p>
        <div id="board-readout" class="board-readout" aria-live="polite">Case board ready <span>Awaiting evidence</span></div>
      </section>

      <aside class="case-file">
        <h2><i class="ph ph-folder-open"></i> Case File</h2>
        <div id="conclusion" class="conclusion empty">
          <i class="ph ph-lightbulb-filament"></i> No conclusion yet. Start the investigation to build the case.
        </div>
        <div id="approval" class="approval hidden">
          <p id="approval-text"></p>
          <div class="approval-actions">
            <button id="approve-btn"><i class="ph-fill ph-check-circle"></i> Approve</button>
            <button id="deny-btn"><i class="ph ph-x-circle"></i> Deny</button>
          </div>
        </div>
        <h3><i class="ph ph-list-magnifying-glass"></i> Event Log</h3>
        <ul id="event-log" class="event-log"></ul>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
